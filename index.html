    description: 'Nel silenzio del chiostro di San Marco, l’angelo Gabriele annuncia a Maria la nascita di Gesù. Beato Angelico costruisce la scena con luce, architettura e gesti misurati, invitando chi guarda a fermarsi e osservare.',

const ANALYSES = {
  'angelo-gabriele': ['A destra vediamo l’angelo Gabriele inginocchiato davanti a Maria. Le ali colorate e il gesto delle mani lo identificano come messaggero divino.', 'Il suo movimento verso Maria rende visibile l’istante dell’annuncio: non è una figura decorativa, ma il protagonista dell’azione narrativa.', 'La figura crea un equilibrio con Maria e il suo abito chiaro risalta contro il portico. Le linee del pavimento accompagnano lo sguardo fino all’incontro.', 'Le ali non servono solo a far riconoscere l’angelo: aggiungono ritmo e colore alla scena.', 'La scena mostra come il Rinascimento usi gesti, spazio e proporzioni per raccontare un episodio sacro in modo comprensibile.'],
  maria: ['Maria è seduta a sinistra, con il corpo leggermente rivolto verso l’angelo. Le mani raccolte e lo sguardo abbassato mostrano che sta ascoltando.', 'Il suo atteggiamento comunica una risposta interiore: il momento non è rappresentato con movimento drammatico, ma con silenzio e concentrazione.', 'Maria occupa uno spazio protetto sotto l’arcata. La distanza tra lei e l’angelo lascia al centro uno spazio vuoto, quasi sospeso, che rende solenne l’incontro.', 'Il gesto delle mani è piccolo, ma funziona come una vera frase visiva: suggerisce attenzione, pudore e accettazione.', 'Nelle Annunciazioni del Quattrocento la stanza o il portico diventano spesso luoghi ordinati, dove la geometria sostiene il significato religioso.'],
  portico: ['La scena è ambientata sotto un portico composto da colonne e archi. Lo spazio è regolare, luminoso e costruito con linee prospettiche.', 'L’architettura non è solo uno sfondo: organizza l’incontro e conduce lo sguardo verso le due figure principali.', 'Le colonne creano intervalli ritmici, mentre il pavimento suggerisce profondità. La prospettiva rende l’evento immaginabile in uno spazio concreto.', 'Il portico ricorda l’architettura rinascimentale fiorentina, dove ordine, proporzione e misura erano considerati segni di armonia.', 'È un esempio di come gli artisti del Rinascimento usassero la prospettiva per dare ordine alla narrazione e guidare l’attenzione dello spettatore.'],
  giardino: ['Oltre il portico si intravede un giardino separato da una recinzione. Gli alberi e il prato introducono un secondo spazio nella composizione.', 'Il giardino aggiunge profondità e crea un contrasto tra lo spazio architettonico dell’incontro e la natura sullo sfondo.', 'La vegetazione accompagna la diagonale dello sguardo verso sinistra e impedisce che il fondo sia piatto o vuoto.', 'Nella tradizione cristiana il giardino può richiamare il tema della purezza e del giardino chiuso, anche se il significato va letto insieme alle altre immagini.', 'Nella pittura religiosa il paesaggio spesso non è neutro: può suggerire ordine, protezione, natura e dimensione spirituale.'],
  luce: ['La luce è chiara e diffusa: illumina il portico, le figure e il pavimento senza creare ombre molto dure.', 'Questa scelta rende la scena silenziosa e sospesa. La luce aiuta a percepire l’annuncio come un evento spirituale, non come un’azione concitata.', 'Il chiarore collega le diverse zone dell’affresco e fa emergere i colori degli abiti. L’occhio passa dalla profondità del giardino alle figure in primo piano.', 'La luce può essere osservata come un elemento compositivo: non indica soltanto l’ora del giorno, ma costruisce il tono emotivo dell’immagine.', 'L’uso della luce per guidare l’emozione diventerà centrale in molti percorsi della pittura italiana, con soluzioni diverse da artista ad artista.']
};
function analyze(artwork, selection, level, selectionImage) { return fetch('/api/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ artwork:{title:artwork.title,artist:artwork.artist,date:artwork.date,period:artwork.period,technique:artwork.technique}, selection, hotspot:artwork.hotspots.find(h=>h.id===selection.hotspotId)||null, sources:artwork.sources, learningLevel:level, language:'it', selectionImage:selectionImage||null }) }).then(async response=>{ const payload=await response.json().catch(()=>({})); if(!response.ok) throw new Error(payload.error?.message || 'Il servizio di analisi non è disponibile.'); return payload; }); }
function ArtworkCard({artwork,onOpen}) { return <button className="artwork-card" onClick={() => onOpen(artwork)} aria-label={'Apri '+artwork.title}><div className="card-image-wrap"><img src={artwork.image} alt={artwork.alt} className="card-image" onError={e=>{e.currentTarget.onerror=null;e.currentTarget.src=artwork.fallbackImage}} />{artwork.featured && <span className="card-badge">In evidenza</span>}<span className="card-arrow"><Icon name="arrow" size={18}/></span></div><div className="card-copy"><div className="eyebrow">{artwork.period}</div><h3>{artwork.title}</h3><p>{artwork.artist} <span>·</span> {artwork.date}</p></div></button>; }
function CatalogPage({artworks,onOpen}) { const [query,setQuery]=React.useState(''); const [period,setPeriod]=React.useState('Tutti i periodi'); const periods=[...new Set(artworks.map(a=>a.period))]; const filtered=artworks.filter(a=>(a.title+' '+a.artist+' '+a.period).toLowerCase().includes(query.toLowerCase())&&(period==='Tutti i periodi'||a.period===period)); return <main className="catalog-page"><section className="hero-section"><div className="hero-copy"><div className="hero-kicker"><span></span> Un modo nuovo di guardare</div><h1>Ogni dettaglio<br/><em>racconta</em> una storia.</h1><p>Esplora le opere d’arte attraverso ciò che spesso passa inosservato. Clicca, osserva, fai domande.</p><div className="hero-actions"><a href="#catalogo" className="primary-button">Inizia a esplorare <Icon name="arrow" size={18}/></a><span className="hero-note"><Icon name="sparkle" size={15}/> Guidato dall’intelligenza artificiale</span></div></div><div className="hero-art"><div className="hero-frame"><img src={artworks[0].image} alt="Dettaglio dell’Annunciazione del Beato Angelico" onError={e=>{e.currentTarget.onerror=null;e.currentTarget.src=artworks[0].fallbackImage}}/><span className="hero-spot hero-spot-one"></span><span className="hero-spot hero-spot-two"></span></div><div className="hero-caption"><span>01</span><span>Annunciazione · Beato Angelico</span></div></div><div className="hero-scribble">guarda<br/>più da vicino</div></section><section className="catalog-section" id="catalogo"><div className="section-heading"><div><span className="eyebrow">La collezione</span><h2>Inizia da un’opera.</h2></div><p>Una selezione di capolavori per allenare lo sguardo e scoprire nuove connessioni.</p></div><div className="catalog-tools"><label className="search-field"><Icon name="search" size={18}/><span className="sr-only">Cerca nell’elenco delle opere</span><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Cerca artista o opera…"/></label><label className="filter-field"><span className="sr-only">Filtra per periodo</span><select value={period} onChange={e=>setPeriod(e.target.value)}><option>Tutti i periodi</option>{periods.map(p=><option key={p}>{p}</option>)}</select><Icon name="chevron" size={16}/></label></div><div className="catalog-grid">{filtered.map(a=><ArtworkCard key={a.id} artwork={a} onOpen={onOpen}/>)}</div>{!filtered.length&&<div className="catalog-empty"><Icon name="search" size={24}/><h3>Nessuna opera trovata</h3><p>Prova a cambiare la ricerca o a rimuovere il filtro.</p></div>}</section></main>; }
function ArtworkViewer({artwork,selectedHotspotId,onHotspotSelect,onFreeSelect}) { const [zoom,setZoom]=React.useState(1); const [pan,setPan]=React.useState({x:0,y:0}); const [drag,setDrag]=React.useState(null); const [hover,setHover]=React.useState(null); const [mediaSize,setMediaSize]=React.useState({width:0,height:0,left:0,top:0}); const imageRef=React.useRef(null); const stageRef=React.useRef(null); const resizeMedia=()=>{const stage=stageRef.current,image=imageRef.current;if(!stage)return;const naturalWidth=image?.naturalWidth||1275,naturalHeight=image?.naturalHeight||900,scale=Math.min(stage.clientWidth/naturalWidth,stage.clientHeight/naturalHeight),width=naturalWidth*scale,height=naturalHeight*scale;setMediaSize({width,height,left:(stage.clientWidth-width)/2,top:(stage.clientHeight-height)/2})}; React.useEffect(()=>{setZoom(1);setPan({x:0,y:0});const observer=window.ResizeObserver?new ResizeObserver(resizeMedia):null;if(observer&&stageRef.current)observer.observe(stageRef.current);resizeMedia();return()=>observer&&observer.disconnect()},[artwork.id]); const changeZoom=d=>setZoom(z=>{const n=Math.max(1,Math.min(3,Number((z+d).toFixed(2))));if(n===1)setPan({x:0,y:0});return n}); const point=e=>{const r=imageRef.current.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}; const down=e=>{if(e.button!==undefined&&e.button!==0)return;setDrag({x:e.clientX,y:e.clientY,moved:false});e.currentTarget.setPointerCapture?.(e.pointerId)}; const move=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){setDrag({x:e.clientX,y:e.clientY,moved:true});if(zoom>1)setPan(p=>({x:p.x+dx,y:p.y+dy}))}}; const up=e=>{if(!drag)return;const moved=drag.moved;setDrag(null);if(!moved)onFreeSelect(point(e))}; const reset=()=>{setZoom(1);setPan({x:0,y:0})}; return <section className="viewer-shell" aria-label={'Esplora '+artwork.title}><div className="viewer-toolbar"><span className="viewer-hint"><Icon name="sparkle" size={15}/> Seleziona un dettaglio per iniziare</span><div className="viewer-controls"><button className="icon-button" onClick={()=>changeZoom(-.25)} disabled={zoom<=1} aria-label="Riduci zoom"><Icon name="minus"/></button><span className="zoom-value" aria-live="polite">{Math.round(zoom*100)}%</span><button className="icon-button" onClick={()=>changeZoom(.25)} disabled={zoom>=3} aria-label="Aumenta zoom"><Icon name="plus"/></button><button className="icon-button reset-button" onClick={reset} aria-label="Ripristina vista"><Icon name="reset"/></button></div></div><div ref={stageRef} className={'artwork-stage '+(zoom>1?'is-zoomed':'')} tabIndex="0" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={()=>setDrag(null)} onKeyDown={e=>{if(e.key==='+'||e.key==='='){e.preventDefault();changeZoom(.25)}if(e.key==='-'){e.preventDefault();changeZoom(-.25)}if(e.key==='0'){e.preventDefault();reset()}}} role="application" aria-label="Area interattiva dell’immagine"><div className="artwork-canvas" style={{width:mediaSize.width?mediaSize.width+'px':'100%',height:mediaSize.height?mediaSize.height+'px':'100%',left:mediaSize.left+'px',top:mediaSize.top+'px',transform:'translate('+pan.x+'px, '+pan.y+'px) scale('+zoom+')'}}><img ref={imageRef} src={artwork.image} alt={artwork.alt} onLoad={resizeMedia} onError={e=>{e.currentTarget.onerror=null;e.currentTarget.src=artwork.fallbackImage}} draggable="false"/><div className="hotspot-layer" aria-hidden="true">{artwork.hotspots.map(h=><span key={h.id} className={'hotspot-region '+(selectedHotspotId===h.id?'active ':'')+(hover===h.id?'hovered':'')} style={{left:h.region.x*100+'%',top:h.region.y*100+'%',width:h.region.width*100+'%',height:h.region.height*100+'%'}}/>)}</div></div></div><div className="hotspot-strip"><div className="hotspot-strip-heading"><span className="eyebrow">Punti di osservazione</span><span className="hotspot-count">{artwork.hotspots.length} suggerimenti</span></div><div className="hotspot-list">{artwork.hotspots.map((h,i)=><button key={h.id} className={'hotspot-chip '+(selectedHotspotId===h.id?'selected':'')} onClick={()=>onHotspotSelect(h)} onMouseEnter={()=>setHover(h.id)} onMouseLeave={()=>setHover(null)} onFocus={()=>setHover(h.id)} onBlur={()=>setHover(null)} aria-pressed={selectedHotspotId===h.id}><span className="chip-index">{String(i+1).padStart(2,'0')}</span><span><strong>{h.title}</strong><small>{h.category}</small></span><Icon name="arrow" size={16}/></button>)}</div></div></section>; }
function AnalysisSection({label,text,accent}){return <section className={'analysis-section '+(accent?'accent':'')}><h3>{label}</h3><p>{text}</p></section>}
function AnalysisPanel({selection,analysis,loading,level,onLevelChange,onRetry,onFeedback}) { const [feedback,setFeedback]=React.useState(null); const [sourcesOpen,setSourcesOpen]=React.useState(true); React.useEffect(()=>setFeedback(null),[analysis&&analysis.id,loading]); return <aside className="analysis-panel" aria-live="polite"><div className="panel-topline"><span className="ai-mark"><Icon name="sparkle" size={15}/> GUIDA AI</span><span className="secure-note">Analisi educativa</span></div><div className="analysis-heading"><div><span className="eyebrow">Dettaglio selezionato</span><h2>{analysis?analysis.title:selection?selection.hotspotTitle:'Da dove vuoi cominciare?'}</h2></div><div className="level-select-wrap"><label htmlFor="learning-level">Livello</label><select id="learning-level" value={level} onChange={e=>onLevelChange(e.target.value)}><option>Scuola secondaria</option><option>Approfondimento</option></select></div></div>{!selection&&!loading&&!analysis&&<div className="empty-analysis"><div className="empty-orbit"><Icon name="sparkle" size={26}/></div><h3>Guarda più da vicino</h3><p>Fai clic su un punto dell’immagine oppure scegli uno dei punti di osservazione suggeriti.</p><div className="empty-tip"><Icon name="info" size={16}/> Inizia da un volto, un colore o un elemento architettonico.</div></div>}{loading&&<div className="analysis-loading"><div className="loading-orbit"><span></span><span></span><span></span></div><h3>Sto osservando il dettaglio…</h3><p>Collego ciò che vediamo al contesto dell’opera e alle fonti selezionate.</p><div className="loading-lines"><i></i><i></i><i></i></div></div>}{analysis&&!loading&&!analysis.id.startsWith('error-')&&<div className="analysis-result"><div className={'confidence '+analysis.confidence.tone}><span className="confidence-dot"></span>{analysis.confidence.label}</div><div className="analysis-sections"><AnalysisSection label="Che cosa stai osservando" text={analysis.content.observation}/><AnalysisSection label="Perché è importante" text={analysis.content.importance}/><AnalysisSection label="Come contribuisce all’opera" text={analysis.content.composition}/><AnalysisSection label="Una curiosità" text={analysis.content.curiosity} accent/><AnalysisSection label="Un collegamento" text={analysis.content.connection}/></div><div className="sources-block"><button className="sources-toggle" onClick={()=>setSourcesOpen(!sourcesOpen)} aria-expanded={sourcesOpen}><span><Icon name="info" size={16}/> Fonti selezionate</span><Icon name="chevron" size={16}/></button>{sourcesOpen&&<div className="sources-list">{analysis.sources.map(s=><a key={s.url} href={s.url} target="_blank" rel="noreferrer">{s.title}<span>{s.type} <Icon name="external" size={13}/></span></a>)}</div>}</div><p className="disclaimer">{analysis.disclaimer}</p><div className="feedback-block"><span>Questa spiegazione ti è stata utile?</span><div className="feedback-actions"><button className={'feedback '+(feedback==='positive'?'selected':'')} onClick={()=>{setFeedback('positive');onFeedback(analysis,'positive')}} aria-pressed={feedback==='positive'}><Icon name="thumbsUp" size={16}/> Sì</button><button className={'feedback '+(feedback==='negative'?'selected':'')} onClick={()=>{setFeedback('negative');onFeedback(analysis,'negative')}} aria-pressed={feedback==='negative'}><Icon name="thumbsDown" size={16}/> Non ancora</button></div>{feedback&&<small className="feedback-thanks">Grazie, il tuo feedback ci aiuta a migliorare.</small>}</div></div>}{selection&&!loading&&(!analysis||analysis.id.startsWith('error-'))&&<div className="analysis-error"><Icon name="info" size={22}/><h3>Non riesco a completare l’analisi</h3><p>{analysis&&analysis.id.startsWith('error-')?analysis.content.observation:'Puoi riprovare oppure selezionare un’altra zona dell’immagine.'}</p><button className="secondary-button" onClick={onRetry}>Riprova analisi</button></div>}</aside>; }
function ExplorePage({artwork,onBack}) { const [selected,setSelected]=React.useState(null),[selection,setSelection]=React.useState(null),[analysis,setAnalysis]=React.useState(null),[loading,setLoading]=React.useState(false),[level,setLevel]=React.useState('Scuola secondaria'); const requestId=React.useRef(0); const createSelectionImage=sel=>new Promise(resolve=>{const image=new Image();image.onload=()=>{try{const pad=.025,x=Math.max(0,sel.x-pad),y=Math.max(0,sel.y-pad),right=Math.min(1,sel.x+(sel.width||.12)+pad),bottom=Math.min(1,sel.y+(sel.height||.12)+pad),sourceWidth=Math.max(1,Math.round((right-x)*image.naturalWidth)),sourceHeight=Math.max(1,Math.round((bottom-y)*image.naturalHeight)),scale=Math.min(1,900/Math.max(sourceWidth,sourceHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(sourceWidth*scale));canvas.height=Math.max(1,Math.round(sourceHeight*scale));canvas.getContext('2d').drawImage(image,Math.round(x*image.naturalWidth),Math.round(y*image.naturalHeight),sourceWidth,sourceHeight,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))}catch(_error){resolve(null)}};image.onerror=()=>resolve(null);image.src=artwork.image}); const run=(sel,hotspot)=>{const currentRequestId=requestId.current+1;requestId.current=currentRequestId;setSelected(hotspot||null);setSelection({...sel,hotspotTitle:hotspot?hotspot.title:'Area selezionata'});setAnalysis(null);setLoading(true);createSelectionImage(sel).then(selectionImage=>analyze(artwork,sel,level,selectionImage)).then(result=>{if(currentRequestId!==requestId.current)return;setAnalysis(result);setLoading(false)}).catch(error=>{if(currentRequestId!==requestId.current)return;setLoading(false);setAnalysis({id:'error-'+Date.now(),title:hotspot?hotspot.title:'Area selezionata',confidence:{label:'Analisi non disponibile',tone:'warm'},content:{observation:error.message,importance:'',composition:'',curiosity:'',connection:''},sources:artwork.sources,disclaimer:'Controlla la configurazione del backend NVIDIA e riprova.'})})}; const choose=h=>run({type:'hotspot',hotspotId:h.id,...h.region},h); const free=p=>run({type:'free',x:p.x,y:p.y,width:.12,height:.12},null); const changeLevel=l=>{setLevel(l);if(selection)run(selection,selected)}; return <main className="explore-page"><header className="explore-header"><button className="back-button" onClick={onBack}><span className="back-icon">←</span> Torna alla collezione</button><div className="explore-progress"><span>01</span><i></i><span>Esplorazione guidata</span></div><button className="header-info" aria-label="Informazioni sull’esperienza"><Icon name="info" size={18}/></button></header><section className="explore-intro"><div><span className="eyebrow">{artwork.period}</span><h1>{artwork.title}</h1><p>{artwork.artist} <span>·</span> {artwork.date} <span>·</span> {artwork.institution}</p></div><div className="explore-tag"><Icon name="sparkle" size={15}/> Esplora i dettagli</div></section><section className="exploration-layout"><div className="viewer-column"><ArtworkViewer artwork={artwork} selectedHotspotId={selected&&selected.id} onHotspotSelect={choose} onFreeSelect={free}/><div className="rights-line">{artwork.rights}</div></div><AnalysisPanel selection={selection} analysis={analysis} loading={loading} level={level} onLevelChange={changeLevel} onRetry={()=>selection&&run(selection,selected)} onFeedback={()=>{}}/></section></main> }
function KeyConfigModal({onClose}){const [status,setStatus]=React.useState('checking');const command='python setup_nvidia_key.py';React.useEffect(()=>{fetch('/api/status').then(r=>r.json()).then(data=>setStatus(data.configured?'configured':'missing')).catch(()=>setStatus('unknown'))},[]);const copy=()=>navigator.clipboard?.writeText(command);return <div className="modal-backdrop" role="presentation" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><section className="config-modal" role="dialog" aria-modal="true" aria-labelledby="config-title"><button className="modal-close" onClick={onClose} aria-label="Chiudi configurazione"><Icon name="close" size={18}/></button><span className="ai-mark"><Icon name="sparkle" size={15}/> CONFIGURAZIONE SICURA</span><h2 id="config-title">Collega l’analisi AI</h2><p>La chiave non viene inserita nella pagina web. Usa il configuratore Tkinter per salvarla nell’ambiente utente di Windows.</p><div className={'config-status '+status}><span></span>{status==='configured'?'Chiave configurata':status==='missing'?'Chiave non ancora configurata':status==='checking'?'Controllo in corso…':'Stato non disponibile'}</div><div className="command-box"><code>{command}</code><button onClick={copy} aria-label="Copia comando">Copia</button></div><ol><li>Avvia il comando in PowerShell.</li><li>Inserisci la chiave e premi <strong>Salva chiave</strong>.</li><li>Riapri il terminale e riavvia <code>node server.mjs</code>.</li></ol><button className="secondary-button modal-action" onClick={onClose}>Ho capito</button></section></div>}
function App(){const [active,setActive]=React.useState(null);const [configOpen,setConfigOpen]=React.useState(false);return <div className="app-shell">{!active&&<header className="site-header"><a href="#top" className="brand" onClick={e=>{e.preventDefault();setActive(null)}}><span className="brand-mark"><i></i><i></i><i></i></span><span>leggi l’<strong>opera</strong></span></a><nav><a href="#catalogo">La collezione</a><a href="#metodo">Come funziona</a></nav><div className="header-actions"><button className="config-button" onClick={()=>setConfigOpen(true)}><Icon name="info" size={14}/> Configura chiave</button><span className="header-pill">Esperienza didattica <Icon name="sparkle" size={14}/></span></div></header>}{active?<ExplorePage artwork={active} onBack={()=>setActive(null)}/>:<CatalogPage artworks={APP_DATA.artworks} onOpen={setActive}/>} {!active&&<footer className="site-footer" id="metodo"><div className="footer-brand"><span className="brand-mark"><i></i><i></i><i></i></span><span>leggi l’<strong>opera</strong></span></div><p>Un invito a guardare con più attenzione.</p><div className="footer-meta"><span>Progetto educativo · 2026</span><span>Realizzato per imparare dall’arte</span></div></footer>}{configOpen&&<KeyConfigModal onClose={()=>setConfigOpen(false)}/>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
