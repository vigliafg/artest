<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>art-creator · crea le schede didattiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#17344a;--muted:#6b7a83;--paper:#f6f3ee;--white:#fffdf9;--line:#dedbd3;--coral:#dc7056;--mustard:#e2ac44;--green:#628f80;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;background:var(--paper)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;letter-spacing:-.04em}
.app{max-width:1200px;margin:0 auto;padding:0 28px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:19px;font-weight:700}
.brand-mark{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.brand-mark i{display:block;width:6px;height:16px;border-radius:5px;transform:rotate(35deg);background:var(--coral)}
.brand-mark i:nth-child(2){height:20px;background:var(--mustard)}
.brand-mark i:nth-child(3){height:13px;background:var(--ink)}
.topbar .right{display:flex;align-items:center;gap:14px}
.eyebrow{color:var(--coral);text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.16em}
.page-title{font-size:38px;margin:8px 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.6;max-width:640px}
.btn{border:0;border-radius:6px;padding:12px 18px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:11px;border-radius:5px}
.card{background:var(--white);border:1px solid #e5e2dc;border-radius:14px;padding:22px;box-shadow:0 6px 20px rgba(30,42,44,.04)}
.banner{background:#fdf1e8;border:1px solid #f0d5c3;border-radius:12px;padding:14px 18px;color:#8a5a3a;font-size:12px;margin-bottom:22px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:#eef6f1;border-color:#cfe5da;color:#47715f}
.grid-artworks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.aw-card{border:0;background:var(--white);border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;text-align:left;padding:0;box-shadow:0 6px 18px rgba(30,42,44,.04)}
.aw-card .thumb{height:170px;background:#eee9e1;overflow:hidden;position:relative}
.aw-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--white);border-radius:20px;padding:5px 9px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}
.badge.ready{color:#47715f}
.aw-card .body{padding:14px 16px}
.aw-card .body h3{margin:0 0 4px;font-size:19px}
.aw-card .body p{margin:0;color:var(--muted);font-size:11px}
.aw-card .actions{display:flex;gap:8px;padding:0 16px 14px}
.aw-card .actions .btn{flex:1;justify-content:center}
/* ---------- workspace ---------- */
.ws-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:22px;align-items:start}
.dropzone{border:2px dashed var(--line);border-radius:14px;background:var(--white);padding:38px 24px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
.dropzone:hover,.dropzone.over{border-color:var(--coral);background:#fff9f5}
.dropzone .dz-icon{font-size:34px;margin-bottom:8px}
.dropzone p{margin:4px 0;font-size:12px}
.image-stage{position:relative;border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;background:#eee9e1}
.image-stage img{width:100%;display:block}
.image-stage .region-overlay{position:absolute;border:2px solid var(--coral);background:rgba(220,112,86,.08);border-radius:2px;pointer-events:none}
.image-stage .region-overlay span{position:absolute;top:-20px;left:0;background:var(--coral);color:#fff;font-size:9px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.detail-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.detail-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--white);cursor:pointer;transition:.15s}
.detail-item:hover{border-color:var(--coral)}
.detail-item.active{border-color:var(--coral);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.detail-item .n{color:var(--coral);font-weight:700;font-size:11px;margin-top:1px}
.detail-item .d strong,.detail-item .d small{display:block}
.detail-item .d strong{font-size:12px}
.detail-item .d small{color:var(--muted);font-size:10px;margin-top:3px}
.detail-item .st{margin-left:auto;font-size:9px;color:var(--green);white-space:nowrap;font-weight:700;text-transform:uppercase}
/* ---------- forms ---------- */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--white);padding:9px 11px;font-size:12px;color:var(--ink)}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
/* ---------- contenuti ---------- */
.content-tabs{display:flex;gap:8px;margin:14px 0 12px}
.ctab{flex:1;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:10px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.ctab.active{border-color:var(--coral);color:var(--ink);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.section-block{border-top:1px solid var(--line);padding:11px 0}
.section-block h4{font-family:'DM Sans';font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);margin:0 0 6px}
.section-block textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:12px;line-height:1.55;min-height:66px;resize:vertical;background:var(--white)}
.section-block.look textarea{min-height:40px;background:var(--paper)}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.step-note{color:var(--muted);font-size:11px;margin:6px 0 0}
.progress{height:6px;background:#eeeae3;border-radius:4px;overflow:hidden;margin:14px 0 8px}
.progress i{display:block;height:100%;background:var(--coral);border-radius:4px;transition:width .4s}
.log-line{font-size:11px;color:var(--muted);padding:2px 0;display:flex;gap:8px;align-items:center}
.log-line.done{color:#47715f}
.log-line .dot{width:6px;height:6px;border-radius:50%;background:var(--mustard);flex-shrink:0}
.log-line.done .dot{background:var(--green)}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.pipe-card{border-left:4px solid var(--coral);margin-bottom:18px}
.pipe-card.ok{border-left-color:var(--green);background:#fbfdf9}
.pipe-card.err{border-left-color:#b03a2e}
.pipe-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pipe-pct{font-size:30px;font-weight:800;font-family:'Playfair Display',Georgia,serif;color:var(--coral);line-height:1}
.pipe-card.ok .pipe-pct{color:var(--green)}
.pipe-activity{font-size:12px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600;line-height:1.5}
.pipe-err{font-size:12px;color:#a33a2a;background:#fbeae7;border-radius:8px;padding:9px 12px;line-height:1.5}
.pipe-done-note{font-size:12px;color:var(--green);margin:8px 0 0;line-height:1.6}
.pipe-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pipe-phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.pipe-chip{font-size:10px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:20px;opacity:.75}
.pipe-chip.act{color:var(--coral);border-color:var(--coral);opacity:1;background:#fff9f5}
.pipe-chip.done{color:#47715f;border-color:#cfe5da;background:#eef6f1;opacity:1}
.img-panel{display:grid;grid-template-columns:minmax(0,4fr) minmax(160px,1fr);gap:14px;align-items:start}
.spot-wrap{position:relative;border:1px solid #e5e2dc;border-radius:12px;overflow:hidden;background:#eee9e1;line-height:0}
.spot-wrap canvas{width:100%;height:auto;display:block}
.cap-rail{background:var(--white);border:1px solid #e5e2dc;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;max-height:540px;overflow:auto}
.rail-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--coral);margin:0 2px 2px}
.cap{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--ink);transition:.15s}
.cap:hover{border-color:var(--coral);background:#fff9f5}
.cap .num{color:var(--coral);font-weight:700;font-size:12px;min-width:16px;padding-top:1px}
.cap .cap-t{font-size:11.5px;line-height:1.35;font-weight:600}
.cap .cap-c{display:block;font-size:9px;color:var(--muted);font-weight:500;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.cap.on{border-color:var(--coral);background:#fff9f5;box-shadow:inset 0 -2px 0 var(--coral)}
.spot-hint{font-size:10px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.spot-edit{position:absolute;inset:0;pointer-events:none;z-index:3}
.spot-edit .bx{position:absolute;border:2px dashed rgba(220,112,86,.9);pointer-events:auto;cursor:move;touch-action:none}
.spot-edit .bx.on{border:2px solid var(--coral);background:rgba(220,112,86,.10)}
.spot-edit .bx-lab{position:absolute;top:4px;left:4px;background:var(--coral);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;line-height:1.4;pointer-events:none;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
.spot-edit .bx.on .bx-lab{background:var(--ink)}
.spot-edit .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--coral);border-radius:3px;pointer-events:auto;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.spot-edit .h.nw{left:-7px;top:-7px;cursor:nwse-resize}
.spot-edit .h.n{left:50%;top:-7px;margin-left:-6px;cursor:ns-resize}
.spot-edit .h.ne{right:-7px;top:-7px;cursor:nesw-resize}
.spot-edit .h.e{right:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
.spot-edit .h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.spot-edit .h.s{left:50%;bottom:-7px;margin-left:-6px;cursor:ns-resize}
.spot-edit .h.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.spot-edit .h.w{left:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
@media(max-width:760px){.img-panel{grid-template-columns:1fr}.cap-rail{max-height:200px}}
/* feedback salvataggio */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d5a43;color:#fff;padding:15px 24px;border-radius:30px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.25);transition:.35s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- viewer ---------- */
.viewer-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:22px;align-items:start}
.viewer-title h1{font-size:42px;margin:6px 0 6px}
.viewer-title .meta{color:var(--muted);font-size:12px;margin:0}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ov-col h4{font-family:'DM Sans';font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--coral);margin:0 0 8px}
.ov-col p{font-size:12px;line-height:1.7;margin:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:22px;margin:0}
.confidence{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;padding:6px 10px;border-radius:20px;background:#e6eef0;color:#47717c}
.hotspot-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hchip{border:1px solid var(--line);background:var(--white);border-radius:30px;padding:8px 13px;font-size:11px;color:var(--ink)}
.hchip.active{border-color:var(--coral);background:#fff9f5;color:var(--coral);font-weight:700}
.sources a{display:block;color:var(--ink);text-decoration:none;font-size:11px;padding:3px 0}
.sources span{color:var(--muted);font-size:9px}
.muted-note{color:var(--muted);font-size:9px;line-height:1.5;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state h2{color:var(--ink);font-size:26px}
@media(max-width:900px){.ws-layout,.viewer-layout{grid-template-columns:1fr}.meta-grid,.ov-grid{grid-template-columns:1fr}.app{padding:0 14px 60px}}
/* ---- Passo 4 · Opere simili ---- */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sim-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.sim-thumb{width:100%;height:150px;object-fit:cover;display:block;background:#eeeae3}
.sim-ph{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#eeeae3;color:var(--muted);font-size:11px;text-align:center;padding:10px;box-sizing:border-box}
.sim-fields{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sim-fields label{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.sim-fields input,.sim-fields textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12px;font-family:inherit;background:var(--white);color:var(--ink);box-sizing:border-box}
.sim-fields textarea{min-height:52px;resize:vertical}
.sim-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sim-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
.sim-status{margin-left:auto;color:var(--muted);font-size:9px}
/* carousel viewer */
.sim-carousel{display:flex;align-items:center;gap:8px;padding:6px 0}
.car-arrow{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.car-arrow:hover{border-color:var(--coral);color:var(--coral)}
.sim-track{flex:1;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.sim-track-inner{display:flex;gap:14px;min-width:max-content}
.sim-slide{flex:0 0 230px;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white);scroll-snap-align:start}
.sim-slide a{display:block}
.sim-thumb-lg{width:100%;height:150px;object-fit:cover;display:block;background:#eeeae3}
.sim-ph-lg{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#eeeae3;color:var(--muted);font-size:11px;text-align:center;padding:10px;box-sizing:border-box}
.sim-slide figcaption{padding:10px 12px}
.sim-slide figcaption strong{display:block;font-size:13px;line-height:1.3;color:var(--ink)}
.sim-slide figcaption span,.sim-slide figcaption small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.sim-slide figcaption p{margin:7px 0 0;color:var(--ink);font-size:11px;line-height:1.5}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= stato ================= */
var state = { view: 'home', artwork: null, list: [], busy: {}, log: [] };

/* ================= api ================= */
function api(path, opts) {
  return fetch(path, opts || {}).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      if (!res.ok) { var e = new Error((body.error && body.error.message) || ('HTTP ' + res.status)); e.status = res.status; e.body = body; throw e; }
      return body;
    });
  });
}
function post(path, body) { return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function put(path, body) { return api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function patch(path, body) { return api(path, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }

/* ================= util ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, ok) {
  var el = document.getElementById('toast');
  el.innerHTML = (ok ? '✓ ' : '⚠ ') + esc(msg);
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 4000);
}
function sectionOf(tab) { return tab === 'studio' ? ['observation', 'meaning', 'relation'] : ['curiosity', 'comparisons', 'openQuestions', 'technique']; }
function fieldLabel(key) {
  return { observation: 'Cosa vedi', meaning: 'Cosa significa', relation: 'In relazione all’opera', curiosity: 'Una curiosità', comparisons: 'Confronti con altre opere', openQuestions: 'Questioni aperte', technique: 'Tecnica e materia', lookAgain: 'Guarda ancora' }[key] || key;
}
function cropDataUrl(imgEl, region, maxSide) {
  return new Promise(function (resolve) {
    if (!imgEl || !imgEl.naturalWidth || !region) return resolve(null);
    var pad = 0.02;
    var x = Math.max(0, region.x - pad), y = Math.max(0, region.y - pad);
    var right = Math.min(1, region.x + region.width + pad), bottom = Math.min(1, region.y + region.height + pad);
    var sw = Math.max(1, (right - x) * imgEl.naturalWidth);
    var sh = Math.max(1, (bottom - y) * imgEl.naturalHeight);
    var scale = Math.min(1, (maxSide || 900) / Math.max(sw, sh));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(sw * scale));
    c.height = Math.max(1, Math.round(sh * scale));
    c.getContext('2d').drawImage(imgEl, x * imgEl.naturalWidth, y * imgEl.naturalHeight, sw, sh, 0, 0, c.width, c.height);
    resolve(c.toDataURL('image/jpeg', 0.85));
  });
}
function fileToDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
var imgCache = {};
function loadImage(src) {
  return new Promise(function (resolve) {
    if (imgCache[src]) return resolve(imgCache[src]);
    var img = new Image();
    img.onload = function () { imgCache[src] = img; resolve(img); };
    img.onerror = function () { resolve(null); };
    img.src = src;
  });
}

/* ================= render ================= */
var appEl = document.getElementById('app');

function iconBtn(label, fn, extra) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn small' + (extra || '');
  b.textContent = label;
  b.onclick = fn;
  return b;
}

function render() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'studio') return renderStudio();
  if (state.view === 'viewer') return renderViewer();
}
function topbar(title, rightHtml) {
  return '<header class="topbar"><a class="brand" href="#" data-nav="home"><span class="brand-mark"><i></i><i></i><i></i></span>art-creator</a>' +
    '<div class="right"><span class="eyebrow">' + esc(title || '') + '</span>' + (rightHtml || '') + '</div></header>';
}

/* ---------- home ---------- */
function renderHome() {
  var html = topbar('schede didattiche', '<button class="btn primary small" data-nav="new">+ Nuova opera</button>');
  html += '<h1 class="page-title">Crea le schede didattiche</h1>';
  html += '<p class="lead">Carica l’immagine di un dipinto: l’intelligenza artificiale propone la scheda dell’opera, i dettagli notevoli e tutte le sezioni didattiche. Tu controlli, correggi e salvi.</p>';
  if (state.list.length === 0) {
    html += '<div class="empty-state card"><h2>Nessuna opera nel database</h2><p>Inizia caricando l’immagine di un dipinto.</p><br><button class="btn primary" data-nav="new">+ Nuova opera</button></div>';
  } else {
    html += '<div class="grid-artworks">';

        (a.imageUrl ? '<img src="' + esc(a.imageUrl) + '" alt="" />' : '') + '</div>' +
        '<div class="body"><h3>' + esc(a.title || 'Senza titolo') + '</h3><p>' + esc(a.artist || '') + (a.date ? ' · ' + esc(a.date) : '') + '</p></div>' +
        '<div class="actions"><button class="btn small" data-open="' + esc(a.id) + '">Modifica</button>' +

/* ---------- studio (nuova opera + workspace) ---------- */
function StudioView() {

      html += '<div class="field"><label>' + f[1] + '</label><input data-meta="' + f[0] + '" value="' + esc(s.meta[f[0]]) + '" placeholder="' + (f[0] === 'location' ? 'es. Corridoio nord, Convento di San Marco' : '') + '" /></div>';
    });

      '<button class="btn small primary" id="btnGenAll">⚡ Genera tutte le tab</button></span></div>';
    html += '<div id="detailsArea"></div></div>';

    // --- STEP 4: presentazione + opere simili (due tab) ---
    html += '<div class="card" style="margin-top:18px"><div class="step-head"><span class="eyebrow">Passo 4 · Presentazione e opere simili</span></div>' +

      '<div id="similarArea" style="display:none"><div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn small primary" id="btnSimilar">✨ Genera opere simili</button></div><div id="similarContent"></div></div></div>';

      '<span class="step-note" id="saveNote">Genera i contenuti, poi salva: la scheda verrà memorizzata nel database SQLite.</span></div>';

function bindStudio(s) {
  var dz = document.getElementById('dz');
  if (dz) {
    var input = document.getElementById('file');
    dz.onclick = function () { input.click(); };
    dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = function () { dz.classList.remove('over'); };
    dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
    input.onchange = function () { if (input.files[0]) handleFile(input.files[0]); };
  }
  if (s.artworkId) {
    var metaBtn = document.getElementById('btnMeta');
    if (metaBtn) metaBtn.onclick = function () { runMeta(); };
    var dBtn = document.getElementById('btnDetails');
    if (dBtn) dBtn.onclick = function () { runDetails(); };
    var oBtn = document.getElementById('btnOverview');
    if (oBtn) oBtn.onclick = function () { runOverview(); };
    var simBtn = document.getElementById('btnSimilar');
    if (simBtn) simBtn.onclick = function () { runSimilar(); };
    var editBtn = document.getElementById('btnEditBoxes');
    if (editBtn) editBtn.onclick = function () { toggleBoxEditor(); };
    var p4 = appEl.querySelectorAll('[data-p4]');
    p4.forEach(function (el) {
      el.onclick = function () {
        var tab = el.getAttribute('data-p4');
        p4.forEach(function (x) { x.classList.toggle('active', x === el); });
        var ov = document.getElementById('overviewArea');
        var sim = document.getElementById('similarArea');
        if (ov) ov.style.display = tab === 'overview' ? '' : 'none';
        if (sim) sim.style.display = tab === 'similar' ? '' : 'none';
        if (tab === 'similar') renderSimilarPanel();
      };
    });
    var sBtn = document.getElementById('btnSave');
    if (sBtn) sBtn.onclick = function () { runSave(); };
    var metaInputs = appEl.querySelectorAll('[data-meta]');
    metaInputs.forEach(function (inp) {
      inp.onchange = function () { s.meta[inp.getAttribute('data-meta')] = inp.value; };
      inp.oninput = function () { s.meta[inp.getAttribute('data-meta')] = inp.value; };
    });
    refreshMetaFromServer();
    renderDetailsPanel();
    renderOverviewPanel();
  }
}

function handleFile(file) {
  if (!file.type.match(/^image\//)) return toast('Il file deve essere un’immagine');
  toast('Caricamento immagine…');
  fileToDataUrl(file).then(function (dataUrl) {
    var id = 'opera-' + Date.now().toString(36);
    studio.pendingFile = dataUrl;
    return post('/api/artworks', { id: id, imageDataUrl: dataUrl }).then(function (body) {
      studio.artworkId = body.artwork.id;
      studio.imageUrl = body.artwork.imageUrl;
      toast('Immagine caricata: opera creata', true);
      render();
      // pipeline automatica: riconoscimento → dettagli → contenuti → presentazione
      pipeStart();
    }).catch(function (e) { toast(e.message); });
  });
}
function refreshMetaFromServer() {
  api('/api/artworks/' + studio.artworkId).then(function (full) {
    ['title', 'artist', 'date', 'period', 'technique', 'institution', 'location'].forEach(function (k) {
      var val = full[k];
      if (val) studio.meta[k] = val;
    });
    var inputs = appEl.querySelectorAll('[data-meta]');
    inputs.forEach(function (inp) { inp.value = studio.meta[inp.getAttribute('data-meta')] || ''; });
    studio.details = full.details || [];
    studio.activeDetailId = studio.activeDetailId || (studio.details[0] ? studio.details[0].id : null);
    renderDetailsPanel();
    renderOverviewPanel();
    paintStudioPanel();
  }).catch(function () {});
}
function collectMetaFromInputs() {
  var inputs = appEl.querySelectorAll('[data-meta]');
  inputs.forEach(function (inp) { studio.meta[inp.getAttribute('data-meta')] = inp.value; });
}
function runMeta() {
  collectMetaFromInputs();
  var btn = document.getElementById('btnMeta');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Riconoscimento…'; }
  post('/api/artworks/' + studio.artworkId + '/generate/meta').then(function (body) {
    var m = body.meta || {};
    Object.keys(m).forEach(function (k) {
      if (k !== 'description' && m[k]) studio.meta[k] = m[k];
    });
    render();
    toast('Metadati riconosciuti — verifica e correggi se serve', true);
  }).catch(function (e) { toast('Riconoscimento fallito: ' + e.message); render(); });
}
function renderOverlays() {
  var wrap = document.getElementById('overlays');
  if (!wrap) return;
  wrap.innerHTML = '';
  var stage = wrap.parentElement;
  studio.details.forEach(function (d) {
    var el = document.createElement('div');
    el.className = 'region-overlay';
    el.style.left = (d.region.x * 100) + '%';
    el.style.top = (d.region.y * 100) + '%';
    el.style.width = (d.region.width * 100) + '%';
    el.style.height = (d.region.height * 100) + '%';
    var lab = document.createElement('span');
    lab.textContent = (studio.details.indexOf(d) + 1) + ' · ' + d.title;
    el.appendChild(lab);
    wrap.appendChild(el);
  });
}
function runDetails() {
  var btn = document.getElementById('btnDetails');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Analisi dell’immagine…'; }
  post('/api/artworks/' + studio.artworkId + '/generate/details').then(function (body) {
    var items = (body.details || []).map(function (d) { return { title: d.title, category: d.category, region: d.region, short: d.short || '' }; });
    if (!items.length) throw new Error('Il modello non ha proposto dettagli: riprova');
    return put('/api/artworks/' + studio.artworkId + '/details', { details: items }).then(function (saved) {
      studio.details = saved.details || [];
      studio.activeDetailId = studio.activeDetailId || (studio.details[0] ? studio.details[0].id : null);
      render();
      toast('Proposti ' + studio.details.length + ' dettagli — ora genera i contenuti', true);
    });
  }).catch(function (e) { toast('Proposta fallita: ' + e.message); render(); });
}
function detailReady(detail, tab) {
  var t = detail.tabs && detail.tabs[tab];
  return t && t.status && t.status !== 'draft' && (t.content.observation || t.content.curiosity || t.content.comparisons || t.content.openQuestions || t.content.meaning || t.content.relation || t.content.technique);
}
function allTabGenerated(detail) {
  return detailReady(detail, 'studio') && detailReady(detail, 'approfondimento');
}
function renderDetailsPanel() {
  var area = document.getElementById('detailsArea');
  if (!area) return;
  var s = studio;
  if (!s.details.length) { area.innerHTML = '<p class="step-note">Nessun dettaglio ancora: premi “Proponi dettagli” per far analizzare l’immagine all’AI.</p>'; return; }
  var html = '<div class="detail-list">';
  s.details.forEach(function (d, i) {
    var okSt = detailReady(d, 'studio') ? 'studio ✓' : '';
    var okA = detailReady(d, 'approfondimento') ? 'approfondimento ✓' : '';
    html += '<div class="detail-item' + (s.activeDetailId === d.id ? ' active' : '') + '" data-sel="' + d.id + '">' +
      '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<div class="d"><strong>' + esc(d.title) + '</strong><small>' + esc(d.category || '') + '</small></div>' +
      '<div class="st">' + (allTabGenerated(d) ? '✔ completo' : (okSt || okA ? 'in corso…' : 'da generare')) + '</div></div>';
  });
  html += '</div>';
  var active = s.details.find(function (d) { return d.id === s.activeDetailId; });
  if (active) html += renderDetailEditor(active);
  area.innerHTML = html;
  area.querySelectorAll('[data-sel]').forEach(function (el) {
    el.onclick = function () {
      s.activeDetailId = Number(el.getAttribute('data-sel'));
      s.spotId = s.activeDetailId;
      renderDetailsPanel();
      paintStudioPanel();
    };
  });
  var genBtn = document.getElementById('btnGenAll');
  if (genBtn) genBtn.onclick = function () { runGenAll(); };
  rebindDetailEditor();
}
function renderDetailEditor(detail) {
  var s = studio;
  var keys = sectionOf(s.activeTab);
  var tabData = detail.tabs && detail.tabs[s.activeTab];
  var html = '<div class="content-tabs">';
  [['studio', 'Studio del dettaglio'], ['approfondimento', 'Approfondimento']].forEach(function (t) {
    html += '<div class="ctab' + (s.activeTab === t[0] ? ' active' : '') + '" data-ctab="' + t[0] + '">' + t[1] + '</div>';
  });
  html += '</div>';
  var content = (tabData && tabData.content) || {};
  var empty = !content.observation && !content.curiosity && !content.comparisons && !content.openQuestions && !content.meaning && !content.relation && !content.technique;
  html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px">' +
    '<button class="btn small" data-regen="' + s.activeTab + '">' + (empty ? '✨ Genera questa tab' : '↻ Rigenera questa tab') + '</button></div>';
  if (empty) html += '<p class="step-note">Contenuto non ancora generato. Premi “Genera questa tab” oppure “Genera tutte le tab” sopra.</p>';
  keys.forEach(function (k) {
    html += '<div class="section-block"><h4>' + fieldLabel(k) + '</h4>' +
      '<textarea data-field="' + k + '">' + esc(content[k] || '') + '</textarea></div>';
  });
  if (s.activeTab === 'studio' || s.activeTab === 'approfondimento') {
    html += '<div class="section-block look"><h4>' + fieldLabel('lookAgain') + '</h4>' +
      '<textarea data-field="lookAgain">' + esc(content.lookAgain || '') + '</textarea></div>';
  }
  html += '<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn small green" id="btnTabSave">Salva questa tab</button></div>';
  return html;
}
function rebindDetailEditor() {
  var area = document.getElementById('detailsArea');
  if (!area) return;
  var ctab = area.querySelectorAll('[data-ctab]');
  ctab.forEach(function (el) {
    el.onclick = function () { studio.activeTab = el.getAttribute('data-ctab'); renderDetailsPanel(); };
  });
  var save = document.getElementById('btnTabSave');
  if (save) save.onclick = function () { saveActiveTab(); };
  var regen = area.querySelectorAll('[data-regen]');
  regen.forEach(function (b) {
    b.onclick = function () {
      var tab = b.getAttribute('data-regen');
      genTab(studio.activeDetailId, tab, b);
    };
  });
}
function collectTabFields(detailId, tab) {
  var area = document.getElementById('detailsArea');
  var detail = studio.details.find(function (d) { return d.id === detailId; });
  var content = {};
  (sectionOf(tab)).forEach(function (k) {
    var ta = area.querySelector('textarea[data-field="' + k + '"]');
    if (ta) content[k] = ta.value;
  });
  var la = area.querySelector('textarea[data-field="lookAgain"]');
  if (la) content.lookAgain = la.value;
  return content;
}
function saveActiveTab() {
  var s = studio;
  var content = collectTabFields(s.activeDetailId, s.activeTab);
  var payload = Object.assign({}, content, { status: 'generated' });
  patch('/api/details/' + s.activeDetailId + '/content/' + s.activeTab, payload).then(function () {
    return api('/api/artworks/' + s.artworkId).then(function (full) {
      studio.details = full.details || [];
      renderDetailsPanel();
      toast('Contenuto salvato', true);
    });
  }).catch(function (e) { toast(e.message); });
}
function genTab(detailId, tab, btn) {
  if (!btn) btn = document.createElement('button');
  var old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  loadImage(studio.imageUrl).then(function (img) {
    var detail = studio.details.find(function (d) { return d.id === detailId; });
    if (!img || !detail) throw new Error('Immagine non disponibile');
    return cropDataUrl(img, detail.region, 900).then(function (crop) {
      return post('/api/details/' + detailId + '/generate/' + tab, { selectionImage: crop }).then(function () {
        return api('/api/artworks/' + studio.artworkId);
      }).then(function (full) {
        studio.details = full.details || [];
        renderDetailsPanel();
        toast('Tab "' + (tab === 'studio' ? 'Studio del dettaglio' : 'Approfondimento') + '" generata', true);
      });
    });
  }).catch(function (e) { toast('Generazione fallita: ' + e.message); renderDetailsPanel(); });
}
function renderOverviewPanel() {
  var area = document.getElementById('overviewContent');
  if (!area) return;
  var full = null;
  api('/api/artworks/' + studio.artworkId).then(function (f) {
    studio.details = f.details || [];
    var ov = f.overview;
    area.innerHTML = ov && (ov.painting || ov.artist)
      ? '<div class="ov-grid"><div class="ov-col"><h4>IL DIPINTO</h4><p>' + esc(ov.painting) + '</p></div><div class="ov-col"><h4>L’ARTISTA</h4><p>' + esc(ov.artist) + '</p></div></div>'
      : '<p class="step-note">Nessuna presentazione ancora: premi “Genera presentazione”.</p>';
  }).catch(function () {});
}
function runOverview() {
  var btn = document.getElementById('btnOverview');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generazione…'; }
  post('/api/artworks/' + studio.artworkId + '/generate/overview').then(function () {
    renderOverviewPanel();
    toast('Presentazione generata', true);
    render();
  }).catch(function (e) { toast('Presentazione fallita: ' + e.message); render(); });
}
function renderSimilarPanel() {
  var area = document.getElementById('similarContent');
  if (!area) return;
  api('/api/artworks/' + studio.artworkId).then(function (f) {
    var works = f.similarWorks || [];
    if (!works.length) { area.innerHTML = '<p class="step-note">Nessuna opera simile ancora. Premi “Genera opere simili”: il modello propone 10 opere con lo stesso soggetto e le immagini vengono cercate su Wikimedia Commons e al MET (download nel database).</p>'; return; }
    var html = '<div class="sim-grid">';
    works.forEach(function (w, index) {
      var img = w.hasImage
        ? '<img class="sim-thumb" src="/api/artworks/' + f.id + '/similar/' + w.id + '/image" alt="" loading="lazy" />'
        : '<div class="sim-ph">' + (w.imageStatus === 'failed' ? '⚠ download fallito' : '🖼 immagine mancante') + '</div>';
      html += '<div class="sim-card" data-sim="' + w.id + '" data-sim-url="' + esc(w.imageUrl || '') + '">' + img +
        '<div class="sim-fields">' +
        '<label>Titolo</label><input data-sf="title" value="' + esc(w.title) + '" />' +
        '<label>Artista</label><input data-sf="artist" value="' + esc(w.artist) + '" />' +
        '<div class="sim-row"><div><label>Data</label><input data-sf="date" value="' + esc(w.date) + '" /></div><div><label>Museo</label><input data-sf="museum" value="' + esc(w.museum) + '" /></div></div>' +
        '<label>Perché è simile</label><textarea data-sf="caption">' + esc(w.caption) + '</textarea>' +
        '<label>URL immagine (opzionale)</label><input data-sf="imageUrl" value="' + esc(w.imageUrl || '') + '" placeholder="lascia vuoto per mantenere quella attuale" />' +
        '<div class="sim-actions">' +
        '<button class="btn small" data-sim-up="' + w.id + '"' + (index === 0 ? ' disabled' : '') + '>▲</button>' +
        '<button class="btn small" data-sim-down="' + w.id + '"' + (index === works.length - 1 ? ' disabled' : '') + '>▼</button>' +
        '<span class="sim-status">' + (w.status === 'approved' ? 'approvato' : (w.hasImage ? 'con immagine' : (w.imageStatus === 'failed' ? 'download fallito' : 'senza immagine'))) + '</span>' +
        '</div></div></div>';
    });
    html += '</div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn small green" id="btnSimSave">💾 Salva opere simili</button></div>';
    area.innerHTML = html;
    var save = document.getElementById('btnSimSave');
    if (save) save.onclick = function () { saveSimilarWorks(); };
    area.querySelectorAll('[data-sim-up]').forEach(function (b) {
      b.onclick = function () { moveSimilar(b.getAttribute('data-sim-up'), -1); };
    });
    area.querySelectorAll('[data-sim-down]').forEach(function (b) {
      b.onclick = function () { moveSimilar(b.getAttribute('data-sim-down'), 1); };
    });
  }).catch(function () {});
}
function runSimilar() {
  var btn = document.getElementById('btnSimilar');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generazione…'; }
  post('/api/artworks/' + studio.artworkId + '/generate/similar').then(function () {
    toast('Opere simili generate con immagini', true);
    render();
  }).catch(function (e) { toast('Generazione opere simili fallita: ' + e.message); render(); });
}
function saveSimilarWorks() {
  var area = document.getElementById('similarContent');
  if (!area) return;
  var cards = area.querySelectorAll('[data-sim]');
  var tasks = [];
  cards.forEach(function (card) {
    var id = card.getAttribute('data-sim');
    var patchBody = {};
    ['title', 'artist', 'date', 'museum', 'caption'].forEach(function (k) {
      var inp = card.querySelector('[data-sf="' + k + '"]');
      if (inp) patchBody[k] = inp.value;
    });
    var urlInp = card.querySelector('[data-sf="imageUrl"]');
    if (urlInp && urlInp.value !== card.getAttribute('data-sim-url')) patchBody.imageUrl = urlInp.value;

function runSave() {
  collectMetaFromInputs();

        });

function genPlans() {
  var s = studio;
  var plans = [];
  (s.details || []).forEach(function (d) {
    var needS = !detailReady(d, 'studio');
    var needA = !detailReady(d, 'approfondimento');

}

}
function runPool(tasks, fn, limit) {
  return new Promise(function (resolve, reject) {
    if (!tasks.length) return resolve();
    var i = 0, running = 0, failed = false, doneCount = 0;
    function launch() {
      while (running < (limit || 3) && i < tasks.length && !failed) {
        var t = tasks[i++];
        running += 1;
        fn(t).then(function () {
          running -= 1; doneCount += 1;
          if (doneCount === tasks.length) resolve();
          else launch();
        }, function (e) { failed = true; reject(e); });
      }
    }
    launch();
  });
}

function runGenAll() {

    if (note) note.textContent = 'Elaboro: ' + plan.title + ' (' + what + ')…';

function drawSpotOnCanvas(canvasId, src, details, selId) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  loadImage(src).then(function (img) {
    if (!img || !canvas) return;
    var sel = null;
    (details || []).forEach(function (d) { if (String(d.id) === String(selId)) sel = d; });
    var W = img.naturalWidth, H = img.naturalHeight;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    if (!sel || !sel.region) {
      ctx.filter = 'none';
      ctx.drawImage(img, 0, 0, W, H);
      return;
    }
    var r = sel.region;
    var x = Math.max(0, Math.min(W - 1, r.x * W));
    var y = Math.max(0, Math.min(H - 1, r.y * H));
    var w = Math.max(1, Math.min(W - x, r.width * W));
    var h = Math.max(1, Math.min(H - y, r.height * H));
    // base in scala di grigi
    ctx.filter = 'grayscale(1)';
    ctx.drawImage(img, 0, 0, W, H);
    ctx.filter = 'none';
    // ripristino a colori solo dentro la regione
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.drawImage(img, 0, 0, W, H);
    ctx.restore();
    // alone bianco + contorno colorato
    ctx.lineWidth = 9;
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#dc7056';
    ctx.strokeRect(x, y, w, h);
  });
}

function startBoxDrag(wrap, box, d, mode, e) {
  if (!d || !d.region) return;
  var r = d.region;
  var start = { x: r.x, y: r.y, w: r.width, h: r.height };
  function rect() { return wrap.getBoundingClientRect(); }
  var rect0 = rect();
  var px = (e.clientX - rect0.left) / rect0.width;
  var py = (e.clientY - rect0.top) / rect0.height;
  var saved = null;
  function round4(v) { return Math.round(v * 10000) / 10000; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function apply(cx, cy) {
    var rc = rect();
    var dx = (cx - rc.left) / rc.width - px;
    var dy = (cy - rc.top) / rc.height - py;
    var x = start.x, y = start.y, w = start.w, h = start.h;
    var MIN = 0.03;
    if (mode === 'move') {
      x = clamp(start.x + dx, 0, 1 - w);
      y = clamp(start.y + dy, 0, 1 - h);
    } else {
      if (mode.indexOf('w') >= 0) { var nxl = clamp(start.x + dx, 0, start.x + start.w - MIN); w = start.x + start.w - nxl; x = nxl; }
      if (mode.indexOf('e') >= 0) { w = clamp(start.w + dx, MIN, 1 - start.x); }
      if (mode.indexOf('n') >= 0) { var nyt = clamp(start.y + dy, 0, start.y + start.h - MIN); h = start.y + start.h - nyt; y = nyt; }
      if (mode.indexOf('s') >= 0) { h = clamp(start.h + dy, MIN, 1 - start.y); }
    }
    box.style.left = (x * 100) + '%';
    box.style.top = (y * 100) + '%';
    box.style.width = (w * 100) + '%';
    box.style.height = (h * 100) + '%';
    saved = { x: round4(x), y: round4(y), width: round4(w), height: round4(h) };
  }
  function up() {
    window.removeEventListener('pointermove', mv);
    window.removeEventListener('pointerup', up);
    if (saved) saveBoxRegion(d.id, saved);
  }
  function mv(ev) { ev.preventDefault(); apply(ev.clientX, ev.clientY); }
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up);
  apply(e.clientX, e.clientY);
}
function saveBoxRegion(detailId, region) {

    var idx = studio.details.findIndex(function (x) { return x.id === detailId; });

/* ================= pipeline automatica (immagine → scheda completa) ================= */
function pipeAlive() { return !!(state.pipeline && state.pipeline.on); }
function pipeWeightDone(p) { var w = 0; if (p.metaDone) w += 15; if (p.detailsDone) w += 30; w += 75 * (p.tabsDone || 0); if (p.overviewDone) w += 45; if (p.similarDone) w += 60; return w; }
function pipeWeightTotal(p) { var tabs = (p.tabsTotal && p.tabsTotal > 0) ? p.tabsTotal : 5; return 15 + 30 + 75 * tabs + 45 + 60; }
function pipeChip(label, st) {
  var icon = st === 2 ? '✓ ' : '';
  return '<span class="pipe-chip' + (st === 2 ? ' done' : st === 1 ? ' act' : '') + '">' + icon + esc(label) + '</span>';
}
function pipelineCardHtml() {
  var p = state.pipeline;
  if (!p || !p.on) return '';
  var total = pipeWeightTotal(p);
  var pct = total ? Math.max(0, Math.min(100, Math.round(100 * pipeWeightDone(p) / total))) : 0;
  var h = '<div class="card pipe-card' + (p.phase === 'done' ? ' ok' : p.phase === 'error' ? ' err' : '') + '">';
  h += '<div class="pipe-head"><span class="eyebrow">generazione automatica</span><span class="pipe-pct">' + pct + '%</span></div>';
  h += '<div class="progress"><i style="width:' + pct + '%"></i></div>';
  h += '<div class="pipe-activity">' + (p.phase === 'done' ? '✓ ' : p.phase === 'error' ? '⚠ ' : '<span class="spinner"></span> ') + esc(p.activity || '') + '</div>';
  if (p.phase === 'done') h += '<p class="pipe-done-note">Tutti i contenuti sono stati generati e compilati nei box. Rivedili uno ad uno (scheda, dettagli e sezioni) e poi premi <strong>💾 Salva nel database</strong>.</p>';
  if (p.phase === 'error') {
    h += '<p class="pipe-err">' + esc(p.err || 'Generazione interrotta') + '</p>';
    h += '<div class="pipe-actions"><button class="btn primary small" data-pipe="retry">⟳ Riprova da dove si è fermato</button><button class="btn small ghost" data-pipe="cancel">✕ Annulla — continua a mano</button></div>';
  }
  h += '<div class="pipe-phases">';
  h += pipeChip('1 · Riconoscimento opera', p.metaDone ? 2 : (p.phase === 'meta' ? 1 : 0));
  h += pipeChip('2 · Dettagli notevoli', p.detailsDone ? 2 : (p.phase === 'details' ? 1 : 0));
  var tabsLabel = '3 · Contenuti dettagli';
  if (p.tabsTotal > 0) tabsLabel += ' (' + Math.min(p.tabsDone, p.tabsTotal) + '/' + p.tabsTotal + ')';
  h += pipeChip(tabsLabel, (p.tabsTotal > 0 && p.tabsDone >= p.tabsTotal) ? 2 : (p.phase === 'tabs' ? 1 : 0));
  h += pipeChip('4 · Presentazione', p.overviewDone ? 2 : (p.phase === 'overview' ? 1 : 0));
  h += pipeChip('5 · Opere simili', p.similarDone ? 2 : (p.phase === 'similar' ? 1 : 0));
  h += '</div></div>';
  return h;
}
function pipeCardWrap() { return document.getElementById('pipelineWrap'); }
function pipePaint() {
  if (!pipeAlive()) return;
  var w = pipeCardWrap();
  if (w) w.innerHTML = pipelineCardHtml();
}
function pipeSet(phase, activity) {
  if (!pipeAlive()) return;
  var p = state.pipeline;

  p.activity = activity;
  p.err = null;

}
function pipeButtonsDisabled(dis) {
  ['btnMeta', 'btnDetails', 'btnGenAll', 'btnOverview', 'btnSimilar', 'btnSave'].forEach(function (id) {
    var b = document.getElementById(id);
    if (b) b.disabled = dis;
  });
}
function syncFieldValue(key, value) {
  state.fieldEdits = state.fieldEdits || {};
  var dm = state.fieldEdits[studio.activeDetailId] || (state.fieldEdits[studio.activeDetailId] = {});
  var tm = dm[studio.activeTab] || (dm[studio.activeTab] = {});
  tm[key] = value;
  var d = studio.details.find(function (x) { return x.id === studio.activeDetailId; });
  if (d) { var t = d.tabs && d.tabs[studio.activeTab]; if (t && t.content) t.content[key] = value; }
}
function pipeStart() {
  var s = studio;
  if (!s || !s.artworkId) return;
  if (state.pipeline && state.pipeline.on) return;
  state.pipeline = {
    on: true, phase: 'meta', activity: 'Riconoscimento dell’opera…', percent: 0,
    metaDone: false, detailsDone: false, overviewDone: false, similarDone: false,
    tabsTotal: 0, tabsDone: 0, err: null, startedAt: Date.now()
  };
  state.fieldEdits = {};
  pipeButtonsDisabled(true);
  pipePaint();
  pipeRun();
}
function pipeRun() {
  var s = studio;
  if (!s || !pipeAlive()) return;
  loadImage(s.imageUrl).then(function () {
    return pipeMetaStep(s);
  }).then(function () {
    return pipeDetailsStep(s);
  }).then(function () {
    return pipeTabsStep(s);
  }).then(function () {
    return pipeOverviewStep(s);
  }).then(function () {
    return pipeSimilarStep(s);
  }).then(function () {
    pipeFinish();
  }).catch(function (e) {
    pipeFail(e && e.message ? e.message : String(e));
  });
}
function pipeMetaStep(s) {
  if (!pipeAlive()) return Promise.resolve();
  if (state.pipeline.metaDone) return Promise.resolve();
  pipeSet('meta', 'Il modello osserva l\u2019immagine e riconosce l\u2019opera: titolo, artista, data\u2026');
  return post('/api/artworks/' + s.artworkId + '/generate/meta').then(function (body) {
    if (!pipeAlive()) return;
    var m = body.meta || {};
    var keys = ['title', 'artist', 'date', 'period', 'technique', 'institution', 'location'];
    var caps = { title: 120, artist: 120, date: 80, period: 80, technique: 80, institution: 120, location: 120 };
    keys.forEach(function (k) { if (m[k]) s.meta[k] = String(m[k]).slice(0, caps[k]); });
    // persiste subito la scheda riconosciuta: serve alle fasi successive (dettagli, presentazione)
    pipeSet('meta', 'Scheda riconosciuta: salvataggio dei metadati\u2026');
    var payload = {};
    keys.forEach(function (k) { payload[k] = s.meta[k] || ''; });
    return patch('/api/artworks/' + s.artworkId, payload);
  }).then(function () {
    if (!pipeAlive()) return;
    var inputs = document.querySelectorAll('[data-meta]');
    inputs.forEach(function (inp) { inp.value = studio.meta[inp.getAttribute('data-meta')] || ''; });
    state.pipeline.metaDone = true;
    pipePaint();
  });
}
function pipeDetailsStep(s) {
  if (!pipeAlive()) return Promise.resolve();
  var p = state.pipeline;
  if (p.detailsDone) return Promise.resolve();
  pipeSet('details', 'Rilevamento dei dettagli notevoli: analisi dell’immagine intera…');
  return post('/api/artworks/' + s.artworkId + '/generate/details').then(function (body) {
    if (!pipeAlive()) return;
    var items = (body.details || []).map(function (d) { return { title: d.title, category: d.category, region: d.region, short: d.short || '' }; });
    if (!items.length) throw new Error('Il modello non ha rilevato dettagli in questa immagine: riprova.');
    pipeSet('details', 'Dettagli trovati: salvataggio delle regioni e immagine annotata (riquadri + didascalie)…');
    return put('/api/artworks/' + s.artworkId + '/details', { details: items });
  }).then(function (saved) {
    if (!pipeAlive()) return;
    s.details = saved.details || [];
    s.activeDetailId = s.details[0] ? s.details[0].id : null;
    var p = state.pipeline;
    p.detailsDone = true;
    p.tabsTotal = s.details.length;
    p.tabsDone = s.details.filter(allTabGenerated).length;
    renderDetailsPanel();
    paintStudioPanel();
    pipePaint();
  });
}
function pipeTabsStep(s) {
  if (!pipeAlive()) return Promise.resolve();
  var p = state.pipeline;
  var todo = (s.details || []).filter(function (d) { return !allTabGenerated(d); });
  var idx = 0;
  function next() {
    if (!pipeAlive()) return Promise.resolve();
    if (idx >= todo.length) {
      p.tabsDone = (s.details || []).filter(allTabGenerated).length;
      pipePaint();
      return Promise.resolve();
    }
    var det = todo[idx++];
    if (!allTabGenerated(det)) {
      pipeSet('tabs', 'Genero i contenuti del dettaglio «' + det.title + '»: Studio del dettaglio + Approfondimento (visione condivisa)…');
      markDetailBadge(det.id, false, false);
      return loadImage(s.imageUrl).then(function (img) {
        return cropDataUrl(img, det.region, 900).then(function (crop) {
          return post('/api/details/' + det.id + '/generate/both', { selectionImage: crop });
        });
      }).then(function () {
        return api('/api/artworks/' + s.artworkId);
      }).then(function (full) {
        if (!pipeAlive()) return;
        s.details = full.details || [];
        s.activeDetailId = det.id;
        renderDetailsPanel();
        renderOverlays();
        p.tabsDone = (s.details || []).filter(allTabGenerated).length;
        pipePaint();
        return next();
      });
    }
    return next();
  }
  return next();
}
function pipeOverviewStep(s) {
  if (!pipeAlive()) return Promise.resolve();
  var p = state.pipeline;
  if (p.overviewDone) return Promise.resolve();
  pipeSet('overview', 'Generazione della presentazione: “Il dipinto” e “L’artista”…');
  return post('/api/artworks/' + s.artworkId + '/generate/overview', {}).then(function () {
    if (!pipeAlive()) return;
    state.pipeline.overviewDone = true;
    renderOverviewPanel();
    pipePaint();
  });
}
function pipeSimilarStep(s) {
  if (!pipeAlive()) return Promise.resolve();
  var p = state.pipeline;
  if (p.similarDone) return Promise.resolve();
  pipeSet('similar', 'Generazione delle opere simili: il modello propone 10 opere con lo stesso soggetto, poi cerco e scarico le immagini da Wikimedia Commons e dal MET…');
  return post('/api/artworks/' + s.artworkId + '/generate/similar', {}).then(function () {
    if (!pipeAlive()) return;
    state.pipeline.similarDone = true;
    pipePaint();
  });
}
function pipeFinish() {
  if (!pipeAlive()) return;
  var s = studio;
  var secs = Math.round((Date.now() - state.pipeline.startedAt) / 1000);
  state.pipeline.activity = 'Pipeline completata in ' + secs + ' secondi: tutti i contenuti sono pronti.';
  state.pipeline.phase = 'done';
  api('/api/artworks/' + s.artworkId).then(function (full) {
    if (!state.pipeline || !studio) return;
    studio.details = full.details || [];
    render();
    toast('Generazione automatica completata — rivedi e premi Salva nel database', true);
  }).catch(function () {
    if (!studio) return;
    render();
    toast('Generazione automatica completata — rivedi e premi Salva nel database', true);
  });
}
function pipeFail(msg) {
  if (!pipeAlive()) return;
  state.pipeline.phase = 'error';
  state.pipeline.err = msg;
  state.pipeline.activity = 'La generazione automatica si è interrotta.';
  pipePaint();
}
function pipeRetry() {
  var s = studio;
  if (!s || !state.pipeline) return;
  var p = state.pipeline;
  p.on = true;
  p.err = null;
  p.phase = 'pre';
  p.activity = 'Riavvio dai contenuti mancanti…';
  pipeButtonsDisabled(true);
  api('/api/artworks/' + s.artworkId).then(function (full) {
    if (!state.pipeline) return;
    s.details = full.details || [];
    p.tabsTotal = (s.details || []).length;
    p.tabsDone = (s.details || []).filter(allTabGenerated).length;
    pipePaint();
    pipeRun();
  }).catch(function (e) { pipeFail(e && e.message ? e.message : 'Errore di rete'); });
}
function pipeCancel() {
  state.pipeline = null;
  render();
  toast('Generazione automatica annullata: puoi procedere manualmente');
}

/* ---------- viewer ---------- */
function openViewer(id) { state.view = 'viewer'; state.viewerId = id; render(); }
function renderViewer() {
  var html = topbar('anteprima didattica', '<button class="btn small" data-nav="home">← Elenco</button>');
  html += '<div id="viewerBody"><div class="empty-state"><span class="spinner"></span> Caricamento…</div></div>';
  appEl.innerHTML = html;
  var b = appEl.querySelector('[data-nav]');
  if (b) b.onclick = function () { state.view = 'home'; refreshList(); };
  api('/api/artworks/' + state.viewerId).then(function (full) {
    if (!full.overview) { appEl.innerHTML = topbar('anteprima', '') + '<div class="empty-state"><h2>Opera non pronta</h2><p>Genera e salva prima i contenuti.</p></div>'; return; }
    renderViewerBody(full);
  }).catch(function () { appEl.innerHTML = '<div class="empty-state">Errore di caricamento</div>'; });
}
function renderViewerBody(full) {
  state.viewerArtwork = full;
  state.viewerDetailId = state.viewerDetailId || (full.details[0] ? full.details[0].id : null);
  state.viewerTab = state.viewerTab || 'studio';
  if (state.viewerSelId === undefined) state.viewerSelId = null;
  var html = '<div class="viewer-title"><span class="eyebrow">' + esc(full.period || '') + '</span>' +
    '<h1>' + esc(full.title) + '</h1>' +
    '<p class="meta">' + esc(full.artist || '') + (full.date ? ' · ' + esc(full.date) : '') + (full.institution ? ' · ' + esc(full.institution) : '') + '</p></div>';
  state.viewerOvTab = state.viewerOvTab || 'overview';
  html += '<div class="card" style="margin:18px 0"><div class="content-tabs" id="ovTabs">' +
    '<div class="ctab' + (state.viewerOvTab === 'overview' ? ' active' : '') + '" data-ovtab="overview">Presentazione</div>' +
    '<div class="ctab' + (state.viewerOvTab === 'similar' ? ' active' : '') + '" data-ovtab="similar">Opere simili</div></div>' +
    '<div id="ovOverviewPane"' + (state.viewerOvTab === 'overview' ? '' : ' style="display:none"') + '><div class="ov-grid">' +
    '<div class="ov-col"><h4>IL DIPINTO</h4><p>' + esc(full.overview.painting) + '</p></div>' +
    '<div class="ov-col"><h4>L’ARTISTA</h4><p>' + esc(full.overview.artist) + '</p></div></div></div>' +
    '<div id="ovSimilarPane"' + (state.viewerOvTab === 'similar' ? '' : ' style="display:none"') + '></div></div>';
  html += '<div class="viewer-layout">';
  // colonna immagine: fasce 1–4 immagine, fascia 5 didascalie
  html += '<div><div class="img-panel"><div class="spot-wrap"><canvas id="vwSpot"></canvas></div><div class="cap-rail" id="vwRail"></div></div>';
  html += '<p class="spot-hint">Seleziona una didascalia a destra: quel dettaglio resta a colori, lo sfondo diventa in scala di grigi. Ripremi la didascalia attiva per tornare all’immagine completa.</p></div>';
  // colonna dettaglio
  var active = full.details.find(function (d) { return d.id === state.viewerDetailId; }) || full.details[0];
  html += '<div class="card">' + renderViewerDetail(active) + '</div>';
  html += '</div>';
  document.getElementById('viewerBody').innerHTML = html;
  bindViewer(full);
  paintViewerSpot();
  renderViewerSimilar(full);
}
function drawViewerOverlays(full) {
  var wrap = document.getElementById('vwOverlays');
  if (!wrap) return;
  if (state.viewerAnnotated && full.annotatedImageUrl) { wrap.innerHTML = ''; return; } // i riquadri sono già nell'immagine
  wrap.innerHTML = '';
  var stage = wrap.parentElement;
  full.details.forEach(function (d) {
    var active = d.id === state.viewerDetailId;
    var el = document.createElement('div');
    el.className = 'region-overlay';
    el.style.left = (d.region.x * 100) + '%';
    el.style.top = (d.region.y * 100) + '%';
    el.style.width = (d.region.width * 100) + '%';
    el.style.height = (d.region.height * 100) + '%';
    if (active) { el.style.borderColor = 'var(--mustard)'; el.style.background = 'rgba(226,172,68,.15)'; el.style.zIndex = '2'; }
    wrap.appendChild(el);
  });
}
function renderViewerDetail(d) {
  var tabs = d.tabs || {};
  var html = '<div class="panel-head"><div><span class="eyebrow">' + esc(d.category || 'dettaglio') + '</span><h3>' + esc(d.title) + '</h3></div>' +
    '<span class="confidence">Analisi generata</span></div>';
  html += '<div class="content-tabs">';
  [['studio', 'Studio del dettaglio'], ['approfondimento', 'Approfondimento']].forEach(function (t) {
    html += '<div class="ctab' + (state.viewerTab === t[0] ? ' active' : '') + '" data-vtab="' + t[0] + '">' + t[1] + '</div>';
  });
  html += '</div>';
  var content = (tabs[state.viewerTab] && tabs[state.viewerTab].content) || {};
  var keys = state.viewerTab === 'studio' ? ['observation', 'meaning', 'relation'] : ['curiosity', 'comparisons', 'openQuestions', 'technique'];
  keys.forEach(function (k) {
    if (!content[k]) return;
    html += '<div class="section-block" style="border-top:none"><h4>' + fieldLabel(k) + '</h4><p style="font-size:12px;line-height:1.7;margin:0">' + esc(content[k]) + '</p></div>';
  });
  if (content.lookAgain) {
    html += '<div class="section-block look" style="border-top:none;background:var(--paper);border-radius:8px;padding:11px 13px"><p style="margin:0;font-size:12px;line-height:1.55"><strong style="color:var(--coral)">Guarda ancora:</strong> ' + esc(content.lookAgain) + '</p></div>';
  }
  html += '<div class="sources" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">';
  (state.viewerSources || []).forEach(function (s) {});
  html += '</div>';
  html += '<p class="muted-note">Contenuto generato con l’intelligenza artificiale e salvato nel database di art-creator. Verifica i dati con le fonti prima dell’uso didattico.</p>';
  return html;
}
function bindViewer(full) {
  appEl.querySelectorAll('[data-vsel]').forEach(function (b) {
    b.onclick = function () { state.viewerDetailId = Number(b.getAttribute('data-vsel')); renderViewerBody(full); };
  });
  appEl.querySelectorAll('[data-vtab]').forEach(function (b) {
    b.onclick = function () { state.viewerTab = b.getAttribute('data-vtab'); renderViewerBody(full); };
  });
  var van = appEl.querySelector('[data-vannot]');
  if (van) van.onclick = function () { state.viewerAnnotated = !state.viewerAnnotated; renderViewerBody(full); };
  appEl.querySelectorAll('[data-ovtab]').forEach(function (b) {
    b.onclick = function () { state.viewerOvTab = b.getAttribute('data-ovtab'); renderViewerBody(full); };
  });
}
function bindGlobal() {
  appEl.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) {
      e.preventDefault();
      var dest = nav.getAttribute('data-nav');
      if (dest === 'home') { state.view = 'home'; state.pipeline = null; refreshList(); }
      else if (dest === 'new') { studio = new StudioView(); state.pipeline = null; state.view = 'studio'; render(); }
      return;
    }
    var open = e.target.closest('[data-open]');
    if (open) { e.preventDefault(); openStudio(open.getAttribute('data-open')); return; }
    var view = e.target.closest('[data-view]');
    if (view) { e.preventDefault(); openViewer(view.getAttribute('data-view')); return; }
    var del = e.target.closest('[data-del]');
    if (del) { e.preventDefault(); removeArtwork(del.getAttribute('data-del')); return; }
    var pipe = e.target.closest('[data-pipe]');
    if (pipe) {
      e.preventDefault();
      if (pipe.getAttribute('data-pipe') === 'retry') pipeRetry();
      else if (pipe.getAttribute('data-pipe') === 'cancel') pipeCancel();
      return;
    }
  });
}
/* ---------- home actions ---------- */
function refreshList() {
  api('/api/artworks').then(function (body) {
    state.list = body.artworks || [];
    state.view = 'home';
    render();
  }).catch(function (e) { toast(e.message); });
}
function removeArtwork(id) {
  if (!confirm('Eliminare questa opera e i suoi contenuti dal database?')) return;
  api('/api/artworks/' + id, { method: 'DELETE' }).then(function () {
    toast('Opera eliminata', true);
    refreshList();
  }).catch(function (e) { toast(e.message); });
}
function openStudio(id) {
  studio = new StudioView();
  state.pipeline = null;
  studio.artworkId = id;
  api('/api/artworks/' + id).then(function (full) {
    studio.imageUrl = full.imageUrl;
    ['title', 'artist', 'date', 'period', 'technique', 'institution', 'location'].forEach(function (k) { if (full[k]) studio.meta[k] = full[k]; });
    studio.details = full.details || [];
    studio.activeDetailId = studio.details[0] ? studio.details[0].id : null;
    state.view = 'studio';
    render();
  }).catch(function (e) { toast(e.message); });
}
/* listener input: registra le modifiche dell'utente negli editor (per il Salva finale) */
appEl.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.matches) return;
  if (t.matches('textarea[data-field]') && studio && studio.artworkId) {
    syncFieldValue(t.getAttribute('data-field'), t.value);
  }
});
/* ================= boot ================= */
bindGlobal();
api('/api/status').then(function (s) {
  if (!s.configured) toast('Chiave OpenRouter non configurata: le generazioni non funzioneranno');
});
refreshList();
</script>
</body>
</html>
